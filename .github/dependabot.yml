version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Keep the Radix primitives together: they share a release cadence and
      # updating them one PR at a time is pure noise.
      radix-ui:
        patterns:
          - "@radix-ui/*"
      # Same for the test toolchain.
      testing:
        patterns:
          - "jest"
          - "jest-*"
          - "@jest/*"
          - "@types/jest"
          - "@testing-library/*"
    ignore:
      # Next and React majors are coordinated upgrades, not weekly bumps.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(docker)"
