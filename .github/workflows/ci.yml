name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Prettier owns formatting; ESLint owns correctness. Run `npm run format`
      # to fix anything this reports.
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Coverage thresholds live in jest.config.js, so a drop below the floor
      # fails this job.
      - run: npm test -- --ci
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Hard gate. Any critical advisory fails unless it is one of the
      # documented Next 14 advisories allowlisted in
      # scripts/check-critical-audit.mjs. Next 14.2.35 is the final 14.x release
      # and the critical RCE fixes only land in 15.5.28+/16.x, so that allowlist
      # is the one exception until docs/NEXT_16_UPGRADE_PLAN.md lands.
      - name: Fail on new critical advisories
        run: node scripts/check-critical-audit.mjs
      # Visibility only. High advisories are documented in SECURITY_DEBT.md:
      # most are lint-time or transitive through Next 14, and the rest resolve
      # only through the Next 16 / zod 4 migrations. Gating on `high` today
      # would leave CI permanently red, which trains people to ignore it.
      - name: Report high advisories (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high
      # Same command, run again so its output lands in the workflow summary
      # rather than only in this job's log -- visible on the run page without
      # opening a step. `|| true`: a summary step must not fail the build even
      # though the command above already reported the real exit code.
      - name: Publish advisory summary
        if: always()
        run: |
          {
            echo "### Dependency audit summary"
            echo "Critical advisories are gated by \`scripts/check-critical-audit.mjs\`; only the documented Next 14 exceptions are allowed. High advisories are non-blocking -- see [SECURITY_DEBT.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/SECURITY_DEBT.md) for accepted risk and [docs/NEXT_16_UPGRADE_PLAN.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/NEXT_16_UPGRADE_PLAN.md) for the fix."
            echo
            echo '```text'
            npm audit --audit-level=high 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Placeholder values only. The build must never require real credentials
      # or reach a live service -- if this job starts needing secrets, that is
      # a regression.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          JWT_SECRET: placeholder-jwt-secret-for-build-only
