name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Prettier owns formatting; ESLint owns correctness. Run `npm run format`
      # to fix anything this reports.
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Coverage thresholds live in jest.config.js, so a drop below the floor
      # fails this job.
      - run: npm test -- --ci
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Hard gate. Any critical advisory fails the build.
      - name: Fail on critical advisories
        run: npm audit --audit-level=critical
      # Visibility only. There are currently 5 high advisories (next, postcss,
      # glob, eslint-config-next, @next/eslint-plugin-next) and every one of
      # them resolves to a single root cause: the advisory range for `next` is
      # 9.3.4-canary.0 - 16.3.0-preview.10, which covers every published 14.x
      # and 15.x release. There is no patched version in the 14 line, so this is
      # not fixable by a patch bump, a minor bump or an override -- the only fix
      # npm audit offers is next@16.3.1, flagged isSemVerMajor, which also drags
      # React 18 -> 19 and ~40 Radix packages with it.
      #
      # Gating on `high` before that migration lands would leave CI permanently
      # red, which is worse than reporting the findings, so they are reported.
      # Suppressing them or lowering the level was rejected: the exposure is
      # real.
      #
      # Turn this into a gate (and delete this step) as the last commit of the
      # Next 16 upgrade. Plan and sequencing: docs/NEXT_16_UPGRADE_PLAN.md
      - name: Report high advisories (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high
      # Same command, run again so its output lands in the workflow summary
      # rather than only in this job's log -- visible on the run page without
      # opening a step. `|| true`: a summary step must not fail the build even
      # though the command above already reported the real exit code.
      - name: Publish high-advisory summary
        if: always()
        run: |
          {
            echo "### Dependency audit: high-severity advisories"
            echo "Non-blocking -- see [SECURITY_DEBT.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/SECURITY_DEBT.md) for accepted risk and [docs/NEXT_16_UPGRADE_PLAN.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/NEXT_16_UPGRADE_PLAN.md) for the fix."
            echo
            echo '```text'
            npm audit --audit-level=high 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Placeholder values only. The build must never require real credentials
      # or reach a live service -- if this job starts needing secrets, that is
      # a regression.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          JWT_SECRET: placeholder-jwt-secret-for-build-only
